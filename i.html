<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Follow Us on Instagram</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      margin: 0;
      padding: 0;
    }

    .instagram-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px;
      background-color: white;
      border-radius: 8px;
      border: 1px solid #ffcccc;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
      text-align: center;
    }

    .instagram-container h1 {
      color: #b30000;
      margin-bottom: 20px;
    }

    .instagram-container p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .instagram-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #e60000;
      color: white;
      font-size: 16px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .instagram-btn:hover {
      background-color: #b30000;
    }

    .instagram-icon {
      font-size: 50px;
      color: #e4405f;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="instagram-container">
  <i class="fab fa-instagram instagram-icon"></i>
  <h1>Follow Us on Instagram</h1>
  <p>Explore programming tips, visual tutorials, and behind-the-scenes on our official Instagram page.</p>
  <a href="https://instagram.com" class="instagram-btn" target="_blank">Go to Instagram</a>
</div>

</body>
</html>
