<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Follow Us on Facebook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      margin: 0;
      padding: 0;
    }

    .facebook-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 30px;
      background-color: white;
      border-radius: 8px;
      border: 1px solid #ffcccc;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
      text-align: center;
    }

    .facebook-container h1 {
      color: #b30000;
      margin-bottom: 20px;
    }

    .facebook-container p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .facebook-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #e60000;
      color: white;
      font-size: 16px;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .facebook-btn:hover {
      background-color: #b30000;
    }

    .facebook-icon {
      font-size: 50px;
      color: #3b5998;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="facebook-container">
  <i class="fab fa-facebook-f facebook-icon"></i>
  <h1>Connect with us on Facebook</h1>
  <p>Stay up-to-date with our latest courses, notes, and programming tips by following our official Facebook page.</p>
  <a href="https://facebook.com" class="facebook-btn" target="_blank">Go to Facebook</a>
</div>

</body>
</html>
