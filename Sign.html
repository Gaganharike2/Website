<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      margin: 0;
      padding: 0;
    }

    .signin-container {
      width: 100%;
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
      border: 1px solid #ffcccc;
    }

    .signin-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #b30000;
    }

    .signin-container form {
      display: flex;
      flex-direction: column;
    }

    .signin-container input[type="email"],
    .signin-container input[type="password"] {
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ff4d4d;
      border-radius: 4px;
      transition: border-color 0.3s;
    }

    .signin-container input[type="email"]:focus,
    .signin-container input[type="password"]:focus {
      border-color: #cc0000;
      outline: none;
    }

    .signin-container input[type="submit"] {
      padding: 10px;
      background-color: #e60000;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .signin-container input[type="submit"]:hover {
      background-color: #b30000;
    }

    .signin-container .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .signin-container a {
      text-decoration: none;
      color: #e60000;
    }

    .signin-container a:hover {
      text-decoration: underline;
      color: #b30000;
    }

    .signin-container p {
      text-align: center;
      margin-top: 15px;
    }
    @media (max-width: 480px) {
  .signin-container {
    margin: 50px 20px;
    padding: 20px;
  }

  .signin-container h2 {
    font-size: 22px;
  }

  .signin-container input[type="email"],
  .signin-container input[type="password"],
  .signin-container input[type="submit"] {
    font-size: 16px;
    padding: 8px;
  }

  .signin-container .options {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .signin-container p {
    font-size: 14px;
  }
}

  </style>
</head>
<body>

<div class="signin-container">
  <h2>Sign In</h2>
  <form action="#" method="post">
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required />
    <div class="options">
      <label><input type="checkbox" name="remember"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    <input type="submit" value="Sign In" />
  </form>
  <p>Don't have an account? <a href="Create.html">Create one</a></p>
</div>
<script>
  // Basic form validation
  document.querySelector("form").addEventListener("submit", function (e) {
    const email = document.querySelector('input[name="email"]').value.trim();
    const password = document.querySelector('input[name="password"]').value.trim();

    if (!email || !password) {
      alert("Please fill in both email and password.");
      e.preventDefault();
    } else {
      // Simulated login action
      alert(`Logged in as: ${email}`);
      e.preventDefault(); // Remove this when connecting to backend
    }
  });

  // Optional: Show/hide password toggle
  const passwordField = document.querySelector('input[name="password"]');
  const toggleLink = document.createElement("a");
  toggleLink.href = "#";
  toggleLink.textContent = "Show";
  toggleLink.style.marginLeft = "10px";
  toggleLink.style.fontSize = "13px";

  passwordField.parentNode.insertBefore(toggleLink, passwordField.nextSibling);

  toggleLink.addEventListener("click", function (e) {
    e.preventDefault();
    if (passwordField.type === "password") {
      passwordField.type = "text";
      toggleLink.textContent = "Hide";
    } else {
      passwordField.type = "password";
      toggleLink.textContent = "Show";
    }
  });
</script>

</body>
</html>
